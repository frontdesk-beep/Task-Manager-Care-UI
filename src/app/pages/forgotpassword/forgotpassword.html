<div class="card p-5 shadow">
    <h2>Forgot Password</h2>
    <input class="form-control mt-3" [(ngModel)]="email" placeholder="Ex@careinsurance.ca">
    <input class="form-control mt-3" [(ngModel)]="newPassword" placeholder="New Password">
    <input class="form-control mt-3" [(ngModel)]="confirmPassword" placeholder="Confirm New Password">
    <button class="btn btn-primary p-2 mt-3" (click)="resetPassword()" [style.background-color]="'#3d4ca7'" >
        Reset Password
    </button>
    <a routerLink="/login" class="btn btn-link" [style.color]="'#3d4ca7'" >
        Back to Login
    </a>
</div>
