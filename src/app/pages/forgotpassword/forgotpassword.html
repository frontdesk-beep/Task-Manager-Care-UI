<div class="auth-card">

    <h2 class="auth-title">Forgot Password</h2>

    <p class="auth-subtitle">
        Enter your email to receive a password reset link.
    </p>

    <!-- Email -->
    <div class="mb-3">
        <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
            placeholder="employee@careinsurance.ca">
    </div>

    <!-- Send Button -->
    <button
        class="auth-btn"
        (click)="sendResetLink()">

        Send Reset Link

    </button>

    <!-- Back -->
    <a
        routerLink="/login"
        class="auth-link">

        Back to Login

    </a>

</div>
