<div class="task-detail">

  <!-- <div *ngIf="loading" class="state-msg">Loading task details...</div> -->

  <div *ngIf="loadError" class="error-msg">Error: {{ loadError }}</div>

  <div *ngIf="!loading && !loadError && !task" class="state-msg">
    No task found.
  </div>

  <div *ngIf="task" class="task-detail-inner">

    <!-- Tabs -->
    <div class="task-tabs">
      <button
        [class.active]="activeTab === 'details'"
        (click)="setTab('details')">
        Details
      </button>

      <button
        [class.active]="activeTab === 'activity'"
        (click)="setTab('activity')">
        Activity
      </button>

      <button
        [class.active]="activeTab === 'remarks'"
        (click)="setTab('remarks')">
        Remarks
      </button>
    </div>

    <div class="tab-panel">
      <app-details
        *ngIf="activeTab === 'details'"
        [task]="task">
      </app-details>

      <app-activity
        *ngIf="activeTab === 'activity'"
        [taskId]="taskId">
      </app-activity>

      <app-remarks
        *ngIf="activeTab === 'remarks'"
        [taskId]="taskId">
      </app-remarks>
    </div>

  </div>

</div>
