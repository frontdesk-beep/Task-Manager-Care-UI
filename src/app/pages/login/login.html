<div class="card p-5 shadow">
    <h1>Login</h1>
    <input [(ngModel)]="email" class="form-control mt-3" placeholder="Ex@careinsurance.ca" required>
    <input type="password" class="form-control mt-3" [(ngModel)]="password" placeholder="Password" required>
    <button class="btn btn-primary mt-3" [style.background-color]="'#3d4ca7'" (click)="onSubmit()">Login</button>
    <a routerLink="/forgotpassword" class="d-block mt-3" [style.color]="'#3d4ca7'" >
        Forgot Password?
    </a>
</div>
