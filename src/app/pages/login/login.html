<div class="card p-5 shadow">
    <h1>Login</h1>
    <div class="mb-3">
        <input [(ngModel)]="email" (blur)="validateEmail()" class="form-control mt-3" placeholder="ex@careinsurance.ca" required>
        <span class="error-message" *ngIf="emailError">{{ emailError }}</span>
    </div>
    <div class="mb-3">
        <input type="password" class="form-control mt-3" [(ngModel)]="password" (blur)="validatePassword()" placeholder="Password" required>
        <span class="error-message" *ngIf="passwordError">{{ passwordError }}</span>
    </div>
    <button class="btn btn-primary mt-3" [style.background-color]="'#3d4ca7'" (click)="onSubmit()">Login</button>
    <a routerLink="/forgotpassword" class="d-block mt-3" [style.color]="'#3d4ca7'" >
        Forgot Password?
    </a>
</div>
