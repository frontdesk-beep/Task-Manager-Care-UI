<div class="auth-card">

    <h2 class="auth-title">Login</h2>

    <p class="auth-subtitle">
        Welcome Back! Please Sign in to continue.
    </p>

    <!-- Email -->
<div class="mb-3">
    <input
        type="email"
        class="form-control"
        [class.invalid]="emailError"
        [(ngModel)]="email"
        (blur)="validateEmail()"
        placeholder="employee@careinsurance.ca"
        maxlength="100"
        autocomplete="username"
        [attr.aria-invalid]="!!emailError"
        required>

    <span class="error-message" *ngIf="emailError">
        {{ emailError }}
    </span>
</div>

<!-- Password -->
<div class="mb-2">
    <input
        type="password"
        class="form-control"
        [class.invalid]="passwordError"
        [(ngModel)]="password"
        (blur)="validatePassword()"
        autocomplete="current-password"
        [attr.aria-invalid]="!!passwordError"
        placeholder="Password"
        required>

    <span class="error-message" *ngIf="passwordError">
        {{ passwordError }}
    </span>
</div>

    <!-- Login Button -->
    <button
        class="auth-btn"
        [disabled]="isSubmitting"
        (click)="onSubmit()">

        {{ isSubmitting ? 'Signing in...' : 'Login' }}

    </button>

    <!-- Forgot Password -->
    <a
        routerLink="/forgotpassword"
        class="auth-link">

        Forgot Password?

    </a>

</div>
