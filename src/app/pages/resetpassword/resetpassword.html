<div class="auth-card">

    <h2 class="auth-title">Reset Password</h2>

    <p class="auth-subtitle">
Enter a new password to reset your account.    </p>

    <!-- New Password -->
    <div class="mb-3">
        <input
            type="password"
            class="form-control"
            [(ngModel)]="newPassword"
            placeholder="New Password">

    </div>

    <!-- Confirm Password -->
    <div class="mb-2">
        <input
            type="password"
            class="form-control"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm Password">

    </div>

    <!-- Reset Button -->
    <button
        class="auth-btn"
        (click)="resetPassword()">

        Reset Password

    </button>

    <!-- Back -->
    <a
        routerLink="/login"
        class="auth-link">

        Back to Login

    </a>

</div>
